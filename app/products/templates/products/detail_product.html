{% extends 'base.html' %}

{% block content %}
<section class="card custom-card p-4">
    <h1 class="section-title h3">{{ product.name }}</h1>
    <p class="h4 text-primary fw-bold my-2">Ціна: ${{ product.price }}</p>
    <p class="lead">{{ product.content }}</p>
    <hr>
    <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">
        &larr; Повернутися до списку товарів
    </a>
</section>
{% endblock %}
