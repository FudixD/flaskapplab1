{% extends 'base.html' %}

{% block content %}
<div class="card custom-card p-4">
    <!-- Vertical navigation (тільки для цієї сторінки) -->
    <nav class="bg-light p-3 rounded mb-4" style="max-width: 260px;">
        <h5 class="fw-bold mb-2">FlaskApp</h5>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link px-0 py-1 text-secondary" href="{{ url_for('users.greetings', name='John', age=30) }}">Greet John</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-0 py-1 text-secondary" href="{{ url_for('users.admin') }}">Admin</a>
            </li>
        </ul>
    </nav>

    <!-- Main content -->
    <h1 class="display-5 fw-light mb-3">Hello :)</h1>
    <h2 class="h4">Hello, {{ name }}!</h2>
    <p class="h5 mt-2"><strong>User:</strong> {{ name }}</p>

    {% if age %}
        <p class="h5 text-success">Age: {{ age }} (You are {{ age }} years old.)</p>
    {% else %}
        <p class="h5 text-danger">Age: Not provided (Age is unknown.)</p>
    {% endif %}
</div>
{% endblock %}
